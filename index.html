<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Art Gallery - The Smash Room</title>
    
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui-layer">
        <div class="hud-text">
            <span id="status-text">Click to Walk</span> &nbsp;|&nbsp; 
            Move: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> &nbsp;|&nbsp; 
            Look: <b>Mouse</b> &nbsp;|&nbsp; 
            Pause: <span class="key">SPACE</span> &nbsp;|&nbsp;
            <b>Left Click: SMASH</b>
        </div>
    </div>
    <div id="pause-indicator">PAUSED</div>
    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // --- Config ---
        const MAIN_ROOM_W = 30;
        const MAIN_ROOM_L = 60;
        const ROOM_HEIGHT = 12;
        const SMASH_ROOM_W = 40;
        const SMASH_ROOM_L = 40;
        const SMASH_Z = -(MAIN_ROOM_L/2 + SMASH_ROOM_L/2); 
        const doorWidth = 8;
        
        // --- Physics Setup ---
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
        world.allowSleep = true; 

        const physicsObjects = []; 
        const defaultMaterial = new CANNON.Material('default');
        const defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, { friction: 0.4, restitution: 0.2 });
        world.addContactMaterial(defaultContactMaterial);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: defaultMaterial });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // --- Three.js Setup (Dynamic Sky Colors) ---
        const colorDay = new THREE.Color(0x87ceeb); // Bright daylight
        const colorDark = new THREE.Color(0x050508); // Moody dark

        const scene = new THREE.Scene();
        scene.background = colorDay.clone();
        scene.fog = new THREE.Fog(colorDay.clone(), 20, 100); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 25); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        document.body.appendChild(renderer.domElement);

        // --- Controls & Raycaster ---
        const controls = new PointerLockControls(camera, document.body);
        const statusText = document.getElementById('status-text');
        const pauseIndicator = document.getElementById('pause-indicator');
        const crosshair = document.getElementById('crosshair');
        const raycaster = new THREE.Raycaster();

        document.addEventListener('mousedown', (e) => { 
            if(!controls.isLocked) { controls.lock(); return; }
            
            // SMASH MECHANIC
            if(e.button === 0) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                for (let i = 0; i < intersects.length; i++) {
                    let hitMesh = intersects[i].object;
                    while(hitMesh.parent && hitMesh.parent.type === 'Group' && hitMesh.parent !== scene) {
                        hitMesh = hitMesh.parent;
                    }

                    const physObj = physicsObjects.find(obj => obj.mesh === hitMesh);
                    if (physObj && physObj.body.mass > 0) {
                        physObj.body.wakeUp(); 
                        const forceDirection = raycaster.ray.direction.clone().normalize();
                        const impulse = new CANNON.Vec3(forceDirection.x * 25, forceDirection.y * 25, forceDirection.z * 25);
                        const impactPoint = new CANNON.Vec3(intersects[i].point.x, intersects[i].point.y, intersects[i].point.z);
                        physObj.body.applyImpulse(impulse, impactPoint);
                        break; 
                    }
                }
            }
        });
        
        controls.addEventListener('lock', () => { 
            statusText.innerHTML = "Walking Mode"; 
            pauseIndicator.style.display = 'none'; 
            crosshair.style.display = 'block'; 
        });
        
        controls.addEventListener('unlock', () => { 
            statusText.innerHTML = "Paused - Click or Space to Resume"; 
            pauseIndicator.style.display = 'block'; 
            crosshair.style.display = 'none'; 
        });

        const moveState = { forward: false, backward: false, left: false, right: false };
        document.addEventListener('keydown', (e) => { 
            if (e.code === 'ArrowUp' || e.code === 'KeyW') moveState.forward = true; 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveState.left = true; 
            if (e.code === 'ArrowDown' || e.code === 'KeyS') moveState.backward = true; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveState.right = true; 
            if (e.code === 'Space') {
                if (controls.isLocked) controls.unlock();
                else controls.lock();
            }
        });

        document.addEventListener('keyup', (e) => { 
            if (e.code === 'ArrowUp' || e.code === 'KeyW') moveState.forward = false; 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveState.left = false; 
            if (e.code === 'ArrowDown' || e.code === 'KeyS') moveState.backward = false; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveState.right = false; 
        });

        document.addEventListener('wheel', (e) => { 
            if (controls.isLocked) {
                camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.05, 20, 75); 
                camera.updateProjectionMatrix(); 
            }
        });

        // --- Zoned Lighting Setup ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6); 
        scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffee, 3.5); 
        sunLight.position.set(-25, 60, 10); 
        sunLight.castShadow = true; 
        sunLight.shadow.mapSize.set(4096, 4096); 
        sunLight.shadow.camera.near = 0.5; 
        sunLight.shadow.camera.far = 200; 
        sunLight.shadow.camera.left = -60; 
        sunLight.shadow.camera.right = 60; 
        sunLight.shadow.camera.top = 60; 
        sunLight.shadow.camera.bottom = -60; 
        sunLight.shadow.bias = -0.0005; 
        scene.add(sunLight);

        // Main Room Fill Lights
        const galleryFill1 = new THREE.PointLight(0xffffff, 1.2, 50);
        galleryFill1.position.set(0, ROOM_HEIGHT - 2, 15);
        scene.add(galleryFill1);
        
        const galleryFill2 = new THREE.PointLight(0xffffff, 1.2, 50);
        galleryFill2.position.set(0, ROOM_HEIGHT - 2, -15);
        scene.add(galleryFill2);

        // --- Texture Generators ---
        const vividColors = ['#ff00ff','#00ffff','#ffff00','#00ff00','#ff3300'];

        const createWoodenBoardTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#e3c099'; ctx.fillRect(0,0,512,512);
            for(let i=0;i<8;i++){const y=i*64;ctx.fillStyle=i%2?'rgba(0,0,0,0.03)':'rgba(255,255,255,0.03)';ctx.fillRect(0,y,512,64);ctx.fillStyle='rgba(139,90,43,0.2)';for(let j=0;j<400;j++)ctx.fillRect(Math.random()*512,y+Math.random()*64,Math.random()*80+20,Math.random()*2+1);ctx.fillStyle='#8a6642';ctx.fillRect(0,y,512,2);}
            return new THREE.CanvasTexture(c);
        };
        const createFleckedMarbleTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,512,512); ctx.lineWidth=2; ctx.strokeStyle='rgba(200,200,200,0.3)';
            for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.bezierCurveTo(Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512);ctx.stroke();}
            for(let i=0;i<6000;i++){const g=Math.floor(Math.random()*100)+80;ctx.fillStyle=`rgba(${g},${g},${g},${Math.random()*0.6+0.2})`;ctx.fillRect(Math.random()*512,Math.random()*512,Math.random()*2.5+0.5,Math.random()*2.5+0.5);}
            return new THREE.CanvasTexture(c);
        };
        const createSplatterTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,512,512); 
            for(let i=0;i<300;i++){ctx.fillStyle=vividColors[Math.floor(Math.random()*vividColors.length)];ctx.beginPath();const x=Math.random()*512;const y=Math.random()*512;const rad=Math.random()*30+5;ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();if(Math.random()>0.7){ctx.fillRect(x-rad/4,y,rad/2,Math.random()*100+20);}}
            return new THREE.CanvasTexture(c);
        };
        
        const createCementTexture = () => {
            const c = document.createElement('canvas'); c.width=512; c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#444444'; ctx.fillRect(0,0,512,512); 
            for(let i=0; i<30000; i++){
                const v = Math.floor(Math.random() * 40) - 20;
                ctx.fillStyle = `rgba(${68+v},${68+v},${68+v},0.5)`;
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
            ctx.lineWidth = 1;
            for(let i=0; i<30; i++) {
                ctx.strokeStyle = `rgba(0,0,0,${Math.random()*0.3})`;
                ctx.beginPath(); ctx.moveTo(Math.random()*512, Math.random()*512);
                for(let j=0; j<4; j++) ctx.lineTo(Math.random()*512, Math.random()*512); ctx.stroke();
            }
            return new THREE.CanvasTexture(c);
        };

        const drawSmashText = (c) => {
            const ctx = c.getContext('2d');
            ctx.fillStyle='#444444'; ctx.fillRect(0,0,c.width,c.height); 
            for(let i=0; i<80000; i++){
                const v = Math.floor(Math.random() * 40) - 20;
                ctx.fillStyle = `rgba(${68+v},${68+v},${68+v},0.5)`;
                ctx.fillRect(Math.random()*c.width, Math.random()*c.height, 3, 3);
            }
            
            const line1 = "SMASH THE"; 
            const line2 = "PARADIGM"; 
            
            ctx.font = "220px 'Sedgwick Ave Display', 'Rubik Dirt', Impact, sans-serif";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const cx = c.width / 2; const cy1 = c.height / 2 - 110; const cy2 = c.height / 2 + 130; 

            const drawGraffitiLine = (txt, y) => {
                ctx.fillStyle = '#000000'; ctx.fillText(txt, cx + 25, y + 25);
                ctx.fillStyle = '#00ffff'; ctx.fillText(txt, cx + 12, y + 12);
                ctx.fillStyle = '#ff00ff'; ctx.fillText(txt, cx - 12, y - 12);
                const grad = ctx.createLinearGradient(0, y-100, 0, y+100);
                grad.addColorStop(0, '#ffff00'); grad.addColorStop(0.5, '#ff3300'); grad.addColorStop(1, '#ff00ff');
                ctx.fillStyle = grad; ctx.fillText(txt, cx, y);
                ctx.strokeStyle = '#111111'; ctx.lineWidth = 16; ctx.strokeText(txt, cx, y);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.strokeText(txt, cx-4, y-4);
            }

            drawGraffitiLine(line1, cy1); drawGraffitiLine(line2, cy2);

            ctx.fillStyle = '#ff3300';
            for(let i=0; i<40; i++) {
                const dx = cx + (Math.random() - 0.5) * 1600; const dy = c.height/2 + (Math.random() - 0.5) * 400;
                ctx.beginPath(); ctx.arc(dx, dy, Math.random()*15+5, 0, Math.PI*2); ctx.fill();
                if(Math.random()>0.5) ctx.fillRect(dx-4, dy, 8, Math.random()*80+20);
            }
            return c;
        };

        const smashCanvas = document.createElement('canvas');
        smashCanvas.width = 2048; smashCanvas.height = 614; 
        const smashTextTex = new THREE.CanvasTexture(drawSmashText(smashCanvas));
        
        const drawNeonGraffiti = (c) => {
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.strokeStyle = '#333333'; ctx.lineWidth = 10; ctx.strokeRect(0,0, c.width, c.height);

            const neonColor = '#00bbff'; const coreColor = '#ffffff'; 
            const cx = c.width / 2; const cyText = c.height / 2 - 80; 

            ctx.font = "140px 'Sedgwick Ave Display', Impact, sans-serif";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const text = "BREAK THIS";

            ctx.shadowColor = neonColor; ctx.shadowBlur = 40; ctx.fillStyle = coreColor; 
            ctx.fillText(text, cx, cyText); ctx.fillText(text, cx, cyText); 
            ctx.shadowBlur = 10; ctx.strokeStyle = neonColor; ctx.lineWidth = 6; ctx.strokeText(text, cx, cyText);

            ctx.beginPath();
            const arrowTop = cyText + 100; const arrowBottom = arrowTop + 110;
            ctx.moveTo(cx, arrowTop); ctx.lineTo(cx, arrowBottom);
            ctx.lineTo(cx - 35, arrowBottom - 35); ctx.moveTo(cx, arrowBottom); ctx.lineTo(cx + 35, arrowBottom - 35);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.shadowColor = neonColor; ctx.shadowBlur = 40; ctx.strokeStyle = neonColor; ctx.lineWidth = 18;
            ctx.stroke(); ctx.stroke(); 
            ctx.shadowBlur = 10; ctx.strokeStyle = coreColor; ctx.lineWidth = 6; ctx.stroke();

            return c;
        };

        const neonCanvas = document.createElement('canvas'); 
        neonCanvas.width = 1024; neonCanvas.height = 512;
        const neonTex = new THREE.CanvasTexture(drawNeonGraffiti(neonCanvas));

        const texStatic = (() => {
            const c = document.createElement('canvas'); c.width = 256; c.height = 256; const ctx = c.getContext('2d');
            for(let i=0; i<256; i+=4) {
                for(let j=0; j<256; j+=4) {
                    const v = Math.floor(Math.random() * 255);
                    ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(i, j, 4, 4);
                }
            }
            return new THREE.CanvasTexture(c);
        })();

        const texDOS = (() => {
            const c = document.createElement('canvas'); c.width = 256; c.height = 256; const ctx = c.getContext('2d');
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,256,256);
            ctx.fillStyle = '#00ff44'; ctx.font = 'bold 28px monospace'; 
            ctx.fillText('C:\\> SMASH.EXE', 10, 40);
            ctx.fillText('Loading...', 10, 80);
            ctx.fillText('SYSTEM ERROR', 10, 120);
            ctx.fillText('_', 10, 160);
            return new THREE.CanvasTexture(c);
        })();

        const texBars = (() => {
            const c = document.createElement('canvas'); c.width = 256; c.height = 256; const ctx = c.getContext('2d');
            const colors = ['#ffffff', '#ffff00', '#00ffff', '#00ff00', '#ff00ff', '#ff0000', '#0000ff'];
            const w = 256 / colors.length;
            colors.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(i*w, 0, w, 256); });
            return new THREE.CanvasTexture(c);
        })();

        document.fonts.ready.then(() => {
            drawSmashText(smashCanvas); smashTextTex.needsUpdate = true;
            drawNeonGraffiti(neonCanvas); neonTex.needsUpdate = true;
        });

        const woodTex = createWoodenBoardTexture(); woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping; woodTex.repeat.set(8,16);
        const marbleTex = createFleckedMarbleTexture(); marbleTex.wrapS=marbleTex.wrapT=THREE.RepeatWrapping; marbleTex.repeat.set(2,2);
        const splatterTex = createSplatterTexture(); splatterTex.wrapS=splatterTex.wrapT=THREE.RepeatWrapping; splatterTex.repeat.set(4,4);
        const cementTex = createCementTexture(); cementTex.wrapS=cementTex.wrapT=THREE.RepeatWrapping; cementTex.repeat.set(2,2);
        
        const materials = {
            floorMain: new THREE.MeshStandardMaterial({map:woodTex, roughness:0.5}),
            floorSmash: new THREE.MeshStandardMaterial({map:splatterTex, roughness:0.8, metalness:0.1}),
            wallWhite: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4}), 
            wallCement: new THREE.MeshStandardMaterial({map:cementTex, roughness:0.9, metalness:0.1}),
            wallSmashText: new THREE.MeshStandardMaterial({map:smashTextTex, roughness:0.9, metalness:0.1}),
            neonSign: new THREE.MeshStandardMaterial({
                map: neonTex, emissiveMap: neonTex, emissive: 0xffffff, emissiveIntensity: 1.5, roughness: 0.2, metalness: 0.8
            }),
            ceiling: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6}), 
            frame: new THREE.MeshStandardMaterial({color:0x333333, roughness:0.4}),
            glass: new THREE.MeshPhysicalMaterial({color:0xffffff, roughness:0.1, transmission:0.9, transparent:true, side:THREE.DoubleSide}),
            marble: new THREE.MeshStandardMaterial({map:marbleTex, roughness:0.1, metalness:0.1}),
            lantern: new THREE.MeshStandardMaterial({color:0xaaaaaa, metalness:0.9, roughness:0.2}),
            bulb: new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff}), 
            beam: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5}),
            rope: new THREE.MeshStandardMaterial({color:0x800000, roughness:0.9}),
            gold: new THREE.MeshStandardMaterial({color:0xffd700, metalness:1, roughness:0.2}), 
            ceramic: new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.05, metalness: 0.05}),
            
            retroPlastic: new THREE.MeshStandardMaterial({color: 0xc8c6b9, roughness: 0.9, metalness: 0.1}),
            blackPlastic: new THREE.MeshStandardMaterial({color: 0x222222, roughness: 0.8, metalness: 0.2}),
            screenStatic: new THREE.MeshStandardMaterial({map: texStatic, roughness: 0.2, metalness: 0.8, emissiveMap: texStatic, emissive: 0xffffff, emissiveIntensity: 0.8}),
            screenDOS: new THREE.MeshStandardMaterial({map: texDOS, roughness: 0.2, metalness: 0.8, emissiveMap: texDOS, emissive: 0xffffff, emissiveIntensity: 1.0}),
            screenBars: new THREE.MeshStandardMaterial({map: texBars, roughness: 0.2, metalness: 0.8, emissiveMap: texBars, emissive: 0xffffff, emissiveIntensity: 0.7}),
            screenOff: new THREE.MeshStandardMaterial({color: 0x050505, roughness: 0.1, metalness: 0.9}),

            bottleGreen: new THREE.MeshPhysicalMaterial({color: 0x00ff00, roughness: 0.1, transmission: 1, transparent: true, thickness: 0.05}),
            bottleBrown: new THREE.MeshPhysicalMaterial({color: 0x8b4513, roughness: 0.1, transmission: 1, transparent: true, thickness: 0.05}),
            bottleClear: new THREE.MeshPhysicalMaterial({color: 0xe0f7fa, roughness: 0.1, transmission: 1, transparent: true, thickness: 0.05})
        };

        // --- MAIN ROOM ARCHITECTURE ---
        const floorMain = new THREE.Mesh(new THREE.PlaneGeometry(MAIN_ROOM_W, MAIN_ROOM_L), materials.floorMain);
        floorMain.rotation.x = -Math.PI / 2; floorMain.receiveShadow = true; scene.add(floorMain);

        const mainWallGroup = new THREE.Group();
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(MAIN_ROOM_W, ROOM_HEIGHT+1, 1), materials.wallWhite); frontWall.position.set(0, (ROOM_HEIGHT+1)/2, MAIN_ROOM_L/2); frontWall.receiveShadow = true; frontWall.castShadow = true; mainWallGroup.add(frontWall);
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, ROOM_HEIGHT+1, MAIN_ROOM_L), materials.wallWhite); leftWall.position.set(-MAIN_ROOM_W/2, (ROOM_HEIGHT+1)/2, 0); leftWall.receiveShadow = true; leftWall.castShadow = true; mainWallGroup.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, ROOM_HEIGHT+1, MAIN_ROOM_L), materials.wallWhite); rightWall.position.set(MAIN_ROOM_W/2, (ROOM_HEIGHT+1)/2, 0); rightWall.receiveShadow = true; rightWall.castShadow = true; mainWallGroup.add(rightWall);
        
        const whiteZ = -MAIN_ROOM_L/2 + 0.25; 
        const mainBackW = (MAIN_ROOM_W - doorWidth) / 2; 
        const bWallL = new THREE.Mesh(new THREE.BoxGeometry(mainBackW, ROOM_HEIGHT+1, 0.5), materials.wallWhite); bWallL.position.set(-(doorWidth/2 + mainBackW/2), (ROOM_HEIGHT+1)/2, whiteZ); bWallL.receiveShadow=true; bWallL.castShadow=true; mainWallGroup.add(bWallL);
        const bWallR = new THREE.Mesh(new THREE.BoxGeometry(mainBackW, ROOM_HEIGHT+1, 0.5), materials.wallWhite); bWallR.position.set((doorWidth/2 + mainBackW/2), (ROOM_HEIGHT+1)/2, whiteZ); bWallR.receiveShadow=true; bWallR.castShadow=true; mainWallGroup.add(bWallR);
        const doorLintelW = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, ROOM_HEIGHT+1-8, 0.5), materials.wallWhite); doorLintelW.position.set(0, 8 + (ROOM_HEIGHT+1-8)/2, whiteZ); doorLintelW.receiveShadow=true; doorLintelW.castShadow=true; mainWallGroup.add(doorLintelW);
        scene.add(mainWallGroup);

        // --- MAIN ROOM CEILING ---
        const ceilingGroup = new THREE.Group();
        const beamDepth = 0.8; const beamWidth = 0.6; const mainBeamSpacing = 6;
        const skylightWidth = 5; const centerCorridorWidth = 6;
        
        const transverseGeo = new THREE.BoxGeometry(MAIN_ROOM_W, beamDepth, beamWidth);
        for(let z = -MAIN_ROOM_L/2; z <= MAIN_ROOM_L/2; z += mainBeamSpacing) {
            const beam = new THREE.Mesh(transverseGeo, materials.beam); beam.position.set(0, ROOM_HEIGHT - beamDepth/2, z); beam.castShadow=true; beam.receiveShadow=true; ceilingGroup.add(beam);
        }
        const longBeamGeo = new THREE.BoxGeometry(beamWidth, beamDepth, MAIN_ROOM_L);
        const xInner = centerCorridorWidth/2 + beamWidth/2; const xOuter = xInner + skylightWidth;
        [xInner, -xInner, xOuter, -xOuter].forEach(x => {
            const beam = new THREE.Mesh(longBeamGeo, materials.beam); beam.position.set(x, ROOM_HEIGHT - beamDepth/2, 0); beam.castShadow=true; beam.receiveShadow=true; ceilingGroup.add(beam);
        });

        const centerRoof = new THREE.Mesh(new THREE.BoxGeometry(centerCorridorWidth, 1, MAIN_ROOM_L), materials.ceiling); centerRoof.position.set(0, ROOM_HEIGHT+0.5, 0); centerRoof.receiveShadow=true; centerRoof.castShadow=true; ceilingGroup.add(centerRoof);
        const outerWidth = (MAIN_ROOM_W/2) - xOuter;
        const leftRoof = new THREE.Mesh(new THREE.BoxGeometry(outerWidth, 1, MAIN_ROOM_L), materials.ceiling); leftRoof.position.set(-(xOuter + outerWidth/2), ROOM_HEIGHT+0.5, 0); leftRoof.receiveShadow=true; leftRoof.castShadow=true; ceilingGroup.add(leftRoof);
        const rightRoof = new THREE.Mesh(new THREE.BoxGeometry(outerWidth, 1, MAIN_ROOM_L), materials.ceiling); rightRoof.position.set((xOuter + outerWidth/2), ROOM_HEIGHT+0.5, 0); rightRoof.receiveShadow=true; rightRoof.castShadow=true; ceilingGroup.add(rightRoof);
        
        const skylightGeo = new THREE.PlaneGeometry(skylightWidth, MAIN_ROOM_L);
        const leftGlass = new THREE.Mesh(skylightGeo, materials.glass); leftGlass.rotation.x = Math.PI/2; leftGlass.position.set(-(xInner + skylightWidth/2), ROOM_HEIGHT, 0); ceilingGroup.add(leftGlass);

        function registerPhysicsPieceGroup(obj3D, shape, mass, position, eulerRot = null) {
            obj3D.position.copy(position);
            if (eulerRot) obj3D.rotation.set(eulerRot.x, eulerRot.y, eulerRot.z);
            
            obj3D.traverse((child) => {
                if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
            });
            scene.add(obj3D);
            
            const body = new CANNON.Body({ mass: mass, shape: shape, material: defaultMaterial });
            body.position.copy(position);
            if (eulerRot) {
                const q = new THREE.Quaternion().setFromEuler(eulerRot);
                body.quaternion.set(q.x, q.y, q.z, q.w);
            }
            if (mass > 0) { body.allowSleep = true; body.sleep(); }
            world.addBody(body);
            physicsObjects.push({ mesh: obj3D, body: body });
        }

        }

        // --- Loop ---
        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3(); 
        const direction = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // Smooth Room Transition
            const inMainRoom = camera.position.z > -30;
            const targetBgColor = inMainRoom ? colorDay : colorDark;
            const targetHemiIntensity = inMainRoom ? 0.6 : 0.15;
            
            scene.background.lerp(targetBgColor, 0.05);
            scene.fog.color.lerp(targetBgColor, 0.05);
            hemiLight.intensity += (targetHemiIntensity - hemiLight.intensity) * 0.05;

            materials.neonSign.emissiveIntensity = Math.abs(Math.sin(time * 3)) * 0.8 + 0.4;

            if (controls.isLocked === true) {
                world.step(1/60, delta, 3);
                for (const obj of physicsObjects) { obj.mesh.position.copy(obj.body.position); obj.mesh.quaternion.copy(obj.body.quaternion); }

                velocity.x -= velocity.x * 10.0 * delta; 
                velocity.z -= velocity.z * 10.0 * delta;
                
                direction.z = Number(moveState.forward) - Number(moveState.backward); 
                direction.x = Number(moveState.right) - Number(moveState.left); 
                direction.normalize(); 
                
                if (moveState.forward || moveState.backward) velocity.z -= direction.z * 100.0 * delta; 
                if (moveState.left || moveState.right) velocity.x -= direction.x * 100.0 * delta;
                
                controls.moveRight(-velocity.x * delta); 
                controls.moveForward(-velocity.z * delta);
                
                let cx = camera.position.x; 
                let cz = camera.position.z;

                if (cz > -MAIN_ROOM_L/2) { 
                    cx = THREE.MathUtils.clamp(cx, -MAIN_ROOM_W/2+1, MAIN_ROOM_W/2-1);
                    if (Math.abs(cx) < doorWidth/2 - 1 && cz < -MAIN_ROOM_L/2 + 2) {
                        cz = Math.min(cz, MAIN_ROOM_L/2-1); 
                    } else {
                        cz = THREE.MathUtils.clamp(cz, -MAIN_ROOM_L/2+1, MAIN_ROOM_L/2-1);
                    }
                } else { 
                    cx = THREE.MathUtils.clamp(cx, -SMASH_ROOM_W/2+1, SMASH_ROOM_W/2-1);
                    if (Math.abs(cx) < doorWidth/2 - 1 && cz > SMASH_Z + SMASH_ROOM_L/2 - 2) {
                        cz = Math.max(cz, SMASH_Z - SMASH_ROOM_L/2+1); 
                    } else {
                        cz = THREE.MathUtils.clamp(cz, SMASH_Z - SMASH_ROOM_L/2+1, SMASH_Z + SMASH_ROOM_L/2-1);
                    }
                }
                
                camera.position.x = cx;
                camera.position.z = cz;
                camera.position.y = 1.7; 
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
