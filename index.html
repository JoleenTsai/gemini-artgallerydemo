<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Art Gallery - The Smash Room</title>
    
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ceviche+One&family=Creepster&family=Permanent+Marker&family=Rubik+Dirt&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui-layer">
        <div class="hud-text">
            <span id="status-text">Click to Walk</span> &nbsp;|&nbsp; 
            Move: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> &nbsp;|&nbsp; 
            Look: <b>Mouse</b> &nbsp;|&nbsp; 
            Pause: <span class="key">SPACE</span> &nbsp;|&nbsp;
            <b>Left Click: SMASH</b>
        </div>
    </div>
    <div id="pause-indicator">PAUSED</div>
    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // --- Config ---
        const MAIN_ROOM_W = 30;
        const MAIN_ROOM_L = 60;
        const ROOM_HEIGHT = 12;
        const SMASH_ROOM_W = 40;
        const SMASH_ROOM_L = 40;
        const SMASH_Z = -(MAIN_ROOM_L/2 + SMASH_ROOM_L/2); 
        const doorWidth = 8;
        
        // --- Physics Setup ---
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
        world.allowSleep = true; 

        const physicsObjects = []; 
        const defaultMaterial = new CANNON.Material('default');
        const defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, { friction: 0.4, restitution: 0.2 });
        world.addContactMaterial(defaultContactMaterial);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: defaultMaterial });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // --- Three.js Setup (Dynamic Sky Colors) ---
        const colorDay = new THREE.Color(0x87ceeb); 
        const colorDark = new THREE.Color(0x1a053a); 

        const scene = new THREE.Scene();
        scene.background = colorDay.clone();
        scene.fog = new THREE.Fog(colorDay.clone(), 20, 100); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 25); 

        // Optimized Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        document.body.appendChild(renderer.domElement);

        // --- Controls & Raycaster ---
        const controls = new PointerLockControls(camera, document.body);
        const statusText = document.getElementById('status-text');
        const pauseIndicator = document.getElementById('pause-indicator');
        const crosshair = document.getElementById('crosshair');
        const raycaster = new THREE.Raycaster();

        document.addEventListener('mousedown', (e) => { 
            if(!controls.isLocked) { controls.lock(); return; }
            
            // SMASH MECHANIC
            if(e.button === 0) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                for (let i = 0; i < intersects.length; i++) {
                    let hitMesh = intersects[i].object;
                    while(hitMesh.parent && hitMesh.parent.type === 'Group' && hitMesh.parent !== scene) {
                        hitMesh = hitMesh.parent;
                    }

                    const physObj = physicsObjects.find(obj => obj.mesh === hitMesh);
                    if (physObj && physObj.body.mass > 0) {
                        physObj.body.wakeUp(); 
                        const forceDirection = raycaster.ray.direction.clone().normalize();
                        const impulse = new CANNON.Vec3(forceDirection.x * 35, forceDirection.y * 35, forceDirection.z * 35);
                        const impactPoint = new CANNON.Vec3(intersects[i].point.x, intersects[i].point.y, intersects[i].point.z);
                        physObj.body.applyImpulse(impulse, impactPoint);
                        break; 
                    }
                }
            }
        });
        
        controls.addEventListener('lock', () => { 
            statusText.innerHTML = "Walking Mode"; 
            pauseIndicator.style.display = 'none'; 
            crosshair.style.display = 'block'; 
        });
        
        controls.addEventListener('unlock', () => { 
            statusText.innerHTML = "Paused - Click or Space to Resume"; 
            pauseIndicator.style.display = 'block'; 
            crosshair.style.display = 'none'; 
        });

        const moveState = { forward: false, backward: false, left: false, right: false };
        document.addEventListener('keydown', (e) => { 
            if (e.code === 'ArrowUp' || e.code === 'KeyW') moveState.forward = true; 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveState.left = true; 
            if (e.code === 'ArrowDown' || e.code === 'KeyS') moveState.backward = true; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveState.right = true; 
            if (e.code === 'Space') {
                if (controls.isLocked) controls.unlock();
                else controls.lock();
            }
        });

        document.addEventListener('keyup', (e) => { 
            if (e.code === 'ArrowUp' || e.code === 'KeyW') moveState.forward = false; 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveState.left = false; 
            if (e.code === 'ArrowDown' || e.code === 'KeyS') moveState.backward = false; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveState.right = false; 
        });

        document.addEventListener('wheel', (e) => { 
            if (controls.isLocked) {
                camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.05, 20, 75); 
                camera.updateProjectionMatrix(); 
            }
        });

        // --- Zoned Lighting Setup ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6); 
        scene.add(hemiLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffee, 3.5); 
        sunLight.position.set(-25, 60, 10); 
        sunLight.castShadow = true; 
        sunLight.shadow.mapSize.set(2048, 2048); 
        sunLight.shadow.camera.near = 0.5; 
        sunLight.shadow.camera.far = 200; 
        sunLight.shadow.camera.left = -60; 
        sunLight.shadow.camera.right = 60; 
        sunLight.shadow.camera.top = 60; 
        sunLight.shadow.camera.bottom = -60; 
        sunLight.shadow.bias = -0.0005; 
        scene.add(sunLight);

        const galleryFill1 = new THREE.PointLight(0xffffff, 1.2, 50);
        galleryFill1.position.set(0, ROOM_HEIGHT - 2, 15);
        scene.add(galleryFill1);
        
        const galleryFill2 = new THREE.PointLight(0xffffff, 1.2, 50);
        galleryFill2.position.set(0, ROOM_HEIGHT - 2, -15);
        scene.add(galleryFill2);

        // --- Texture Generators ---
        const vividColors = ['#ff00ff','#00ffff','#ffff00','#00ff00','#ff3300'];

        const createWoodenBoardTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#e3c099'; ctx.fillRect(0,0,512,512);
            for(let i=0;i<8;i++){const y=i*64;ctx.fillStyle=i%2?'rgba(0,0,0,0.03)':'rgba(255,255,255,0.03)';ctx.fillRect(0,y,512,64);ctx.fillStyle='rgba(139,90,43,0.2)';for(let j=0;j<400;j++)ctx.fillRect(Math.random()*512,y+Math.random()*64,Math.random()*80+20,Math.random()*2+1);ctx.fillStyle='#8a6642';ctx.fillRect(0,y,512,2);}
            return new THREE.CanvasTexture(c);
        };
        
        const createRottingWoodTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#4a4036'; ctx.fillRect(0,0,512,512); 
            for(let i=0;i<8;i++){
                const y=i*64;
                ctx.fillStyle=i%2?'rgba(0,0,0,0.1)':'rgba(255,255,255,0.02)';
                ctx.fillRect(0,y,512,64);
                ctx.fillStyle='rgba(30,25,20,0.4)';
                for(let j=0;j<400;j++) ctx.fillRect(Math.random()*512,y+Math.random()*64,Math.random()*80+20,Math.random()*2+1);
                ctx.fillStyle='rgba(40,50,30,0.3)'; 
                for(let j=0;j<150;j++) {
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, y+Math.random()*64, Math.random()*15+5, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.fillStyle='#221c16'; ctx.fillRect(0,y,512,2); 
            }
            return new THREE.CanvasTexture(c);
        };
        
        const createFleckedMarbleTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,512,512); ctx.lineWidth=2; ctx.strokeStyle='rgba(200,200,200,0.3)';
            for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.bezierCurveTo(Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512);ctx.stroke();}
            for(let i=0;i<6000;i++){const g=Math.floor(Math.random()*100)+80;ctx.fillStyle=`rgba(${g},${g},${g},${Math.random()*0.6+0.2})`;ctx.fillRect(Math.random()*512,Math.random()*512,Math.random()*2.5+0.5,Math.random()*2.5+0.5);}
            return new THREE.CanvasTexture(c);
        };

        const createGlowFloorTextures = () => {
            const size = 1024;
            const diffCanvas = document.createElement('canvas'); diffCanvas.width = size; diffCanvas.height = size;
            const diffCtx = diffCanvas.getContext('2d');
            const emCanvas = document.createElement('canvas'); emCanvas.width = size; emCanvas.height = size;
            const emCtx = emCanvas.getContext('2d');

            diffCtx.fillStyle='#1a1a1a'; diffCtx.fillRect(0,0,size,size);
            emCtx.fillStyle='#000000'; emCtx.fillRect(0,0,size,size); 

            for(let i=0; i<150; i++){ 
                const color = vividColors[Math.floor(Math.random()*vividColors.length)];
                const x = Math.random()*size; const y = Math.random()*size;
                const rad = Math.random()*12 + 2;

                diffCtx.fillStyle = color; diffCtx.beginPath(); diffCtx.arc(x,y,rad,0,Math.PI*2); diffCtx.fill();
                emCtx.fillStyle = color; emCtx.beginPath(); emCtx.arc(x,y,rad,0,Math.PI*2); emCtx.fill();

                if(Math.random()>0.6){
                    const dripLen = Math.random()*60 + 10;
                    diffCtx.fillRect(x-rad/4, y, rad/2, dripLen);
                    emCtx.fillRect(x-rad/4, y, rad/2, dripLen);
                }
                for(let j=0; j<4; j++) {
                    const dx = x + (Math.random()-0.5)*40; const dy = y + (Math.random()-0.5)*40;
                    const dr = Math.random()*4;
                    diffCtx.fillStyle = color; diffCtx.beginPath(); diffCtx.arc(dx,dy,dr,0,Math.PI*2); diffCtx.fill();
                    emCtx.fillStyle = color; emCtx.beginPath(); emCtx.arc(dx,dy,dr,0,Math.PI*2); emCtx.fill();
                }
            }
            return { diffuse: new THREE.CanvasTexture(diffCanvas), emissive: new THREE.CanvasTexture(emCanvas) };
        };

        const createGlowWallTextures = () => {
            const size = 1024;
            const diffCanvas = document.createElement('canvas'); diffCanvas.width = size; diffCanvas.height = size;
            const diffCtx = diffCanvas.getContext('2d');
            const emCanvas = document.createElement('canvas'); emCanvas.width = size; emCanvas.height = size;
            const emCtx = emCanvas.getContext('2d');

            diffCtx.fillStyle='#333333'; diffCtx.fillRect(0,0,size,size);
            for(let i=0; i<30000; i++){
                const v = Math.floor(Math.random() * 40) - 20;
                diffCtx.fillStyle = `rgba(${68+v},${68+v},${68+v},0.5)`;
                diffCtx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
            }
            emCtx.fillStyle='#000000'; emCtx.fillRect(0,0,size,size); 

            // Light splatters
            for(let i=0; i<60; i++){
                const color = vividColors[Math.floor(Math.random()*vividColors.length)];
                const x = Math.random()*size; const y = Math.random()*size;
                const rad = Math.random()*15 + 3;

                diffCtx.fillStyle = color; diffCtx.beginPath(); diffCtx.arc(x,y,rad,0,Math.PI*2); diffCtx.fill();
                emCtx.fillStyle = color; emCtx.beginPath(); emCtx.arc(x,y,rad,0,Math.PI*2); emCtx.fill();

                if(Math.random()>0.5){
                    const dripLen = Math.random()*100 + 20;
                    diffCtx.fillRect(x-rad/4, y, rad/2, dripLen);
                    emCtx.fillRect(x-rad/4, y, rad/2, dripLen);
                }
            }
            return { diffuse: new THREE.CanvasTexture(diffCanvas), emissive: new THREE.CanvasTexture(emCanvas) };
        };

        // --- MURAL WITH OVERLAPPING TEXT ---
        const createRightWallMuralTexture = () => {
            const width = 2048; const height = 1024;
            const diffCanvas = document.createElement('canvas'); diffCanvas.width = width; diffCanvas.height = height;
            const diffCtx = diffCanvas.getContext('2d');
            const emCanvas = document.createElement('canvas'); emCanvas.width = width; emCanvas.height = height;
            const emCtx = emCanvas.getContext('2d');

            diffCtx.clearRect(0,0,width,height);
            emCtx.clearRect(0,0,width,height);
            
            const neonPink = '#ff00ff'; const neonYellow = '#ffff00';
            const sprayGreen = '#39ff14'; const sprayOrange = '#ff6600';
            const sprayPurple = '#9d00ff'; const sprayNeonCyan = '#00ffcc';

            const textX = width * 0.32; const textY = height / 2 + 140; 
            const errX = width * 0.30; const errY = height / 2 - 180;   
            const smileyX = width * 0.78; const smileyY = height / 2;
            const smileyRad = height * 0.4;

            const generateFX = (baseX, baseY, widthRange, count) => {
                const drips = [];
                const speckles = [];
                for (let i = 0; i < count; i++) {
                    drips.push({
                        dx: baseX + (Math.random() - 0.5) * widthRange,
                        dy: baseY + 50 + (Math.random() * 80),
                        w: Math.random() * 8 + 4,
                        h: Math.random() * 150 + 40
                    });
                }
                for(let i = 0; i < count * 8; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * (widthRange * 0.6);
                    speckles.push({
                        sx: baseX + Math.cos(angle) * dist * 1.5,
                        sy: baseY + Math.sin(angle) * dist * 0.6,
                        r: Math.random() * 5 + 1
                    });
                }
                return { drips, speckles };
            };

            const fx949 = generateFX(textX, textY, 800, 50);
            const fxErrvine = generateFX(errX, errY, 900, 60);

            const drawSprayPaintText = (ctx, text, x, y, color1, color2, isEmissive, fontStr, rotation, fxData, outlineColor = null) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                ctx.font = fontStr;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";

                const grad = ctx.createLinearGradient(-400, 0, 400, 0);
                grad.addColorStop(0, color1); grad.addColorStop(1, color2);

                ctx.shadowBlur = isEmissive ? 80 : 15;
                ctx.shadowColor = color1;
                ctx.fillStyle = grad;
                ctx.fillText(text, 0, 0);
                
                if (isEmissive) {
                    ctx.shadowBlur = 40; ctx.shadowColor = color2;
                    ctx.fillText(text, 0, 0);
                }

                if (outlineColor) {
                    ctx.lineWidth = 15;
                    ctx.strokeStyle = outlineColor;
                    ctx.shadowBlur = isEmissive ? 15 : 0; 
                    ctx.shadowColor = outlineColor;
                    ctx.strokeText(text, 0, 0);
                }

                ctx.restore();

                ctx.shadowBlur = isEmissive ? 20 : 5;
                fxData.drips.forEach(drip => {
                    ctx.shadowColor = (drip.dx < x) ? color1 : color2;
                    ctx.fillStyle = (drip.dx < x) ? color1 : color2;
                    ctx.fillRect(drip.dx, drip.dy, drip.w, drip.h);
                    ctx.beginPath();
                    ctx.arc(drip.dx + drip.w/2, drip.dy + drip.h, drip.w/2, 0, Math.PI*2);
                    ctx.fill();
                });
                
                ctx.shadowBlur = isEmissive ? 10 : 2;
                fxData.speckles.forEach(sp => {
                    ctx.fillStyle = (sp.sx < x) ? color1 : color2;
                    ctx.beginPath(); ctx.arc(sp.sx, sp.sy, sp.r, 0, Math.PI * 2); ctx.fill();
                });
            };

            const drawSmiley = (ctx, cx, cy, faceRad) => {
                ctx.shadowBlur = 0; 
                ctx.beginPath(); ctx.arc(cx, cy, faceRad, 0, Math.PI*2);
                ctx.fillStyle = neonYellow; ctx.fill();
                ctx.lineWidth = 25; ctx.strokeStyle = neonPink; ctx.stroke();

                const drawHeart = (hx, hy, hs) => {
                    ctx.beginPath();
                    ctx.moveTo(hx, hy + hs*0.3);
                    ctx.bezierCurveTo(hx - hs/2, hy - hs/2, hx - hs, hy + hs/3, hx, hy + hs);
                    ctx.bezierCurveTo(hx + hs, hy + hs/3, hx + hs/2, hy - hs/2, hx, hy + hs*0.3);
                    ctx.fillStyle = neonPink; ctx.fill();
                };
                const eyeOffX = faceRad * 0.4; const eyeOffY = faceRad * 0.2; const heartS = faceRad * 0.35;
                drawHeart(cx - eyeOffX, cy - eyeOffY, heartS);
                drawHeart(cx + eyeOffX, cy - eyeOffY, heartS);

                ctx.beginPath(); ctx.arc(cx, cy, faceRad*0.65, 0.2*Math.PI, 0.8*Math.PI);
                ctx.lineWidth = 25; ctx.strokeStyle = neonPink; ctx.lineCap = 'round'; ctx.stroke();
            };

            const font949 = "bold 650px 'Spartical', 'Sedgwick Ave Display', 'Permanent Marker', cursive";
            const fontErrvine = "450px 'Ceviche One', 'Creepster', 'Rubik Dirt', cursive";

            drawSprayPaintText(diffCtx, "949", textX, textY, sprayGreen, sprayOrange, false, font949, 0, fx949);
            drawSprayPaintText(diffCtx, "ERRVINE", errX, errY, sprayPurple, sprayNeonCyan, false, fontErrvine, -0.15, fxErrvine, '#ffffff');
            drawSmiley(diffCtx, smileyX, smileyY, smileyRad);

            drawSprayPaintText(emCtx, "949", textX, textY, sprayGreen, sprayOrange, true, font949, 0, fx949);
            drawSprayPaintText(emCtx, "ERRVINE", errX, errY, sprayPurple, sprayNeonCyan, true, fontErrvine, -0.15, fxErrvine, '#ffffff');
            drawSmiley(emCtx, smileyX, smileyY, smileyRad);

            return { diffuse: new THREE.CanvasTexture(diffCanvas), emissive: new THREE.CanvasTexture(emCanvas) };
        };

        const smashDiffCanvas = document.createElement('canvas'); smashDiffCanvas.width = 2048; smashDiffCanvas.height = 614; 
        const smashEmCanvas = document.createElement('canvas'); smashEmCanvas.width = 2048; smashEmCanvas.height = 614; 

        const drawSmashText = (diffCanvas, emCanvas) => {
            const diffCtx = diffCanvas.getContext('2d');
            const emCtx = emCanvas.getContext('2d');
            
            diffCtx.fillStyle='#333333'; diffCtx.fillRect(0,0,diffCanvas.width,diffCanvas.height); 
            for(let i=0; i<80000; i++){
                const v = Math.floor(Math.random() * 40) - 20;
                diffCtx.fillStyle = `rgba(${68+v},${68+v},${68+v},0.5)`;
                diffCtx.fillRect(Math.random()*diffCanvas.width, Math.random()*diffCanvas.height, 3, 3);
            }
            emCtx.fillStyle='#000000'; emCtx.fillRect(0,0,emCanvas.width,emCanvas.height); 
            
            diffCtx.lineCap='round'; diffCtx.lineJoin='round';
            for(let i=0; i<20; i++){
                diffCtx.strokeStyle = vividColors[Math.floor(Math.random()*vividColors.length)]; 
                diffCtx.lineWidth = Math.random()*20+10;
                diffCtx.beginPath(); diffCtx.moveTo(Math.random()*diffCanvas.width, Math.random()*diffCanvas.height);
                for(let j=0;j<5;j++) diffCtx.lineTo(Math.random()*diffCanvas.width, Math.random()*diffCanvas.height); 
                diffCtx.stroke();
            }
            
            const line1 = "SMASH THE"; 
            const line2 = "PARADIGM"; 
            diffCtx.font = "220px 'Sedgwick Ave Display', 'Rubik Dirt', Impact, sans-serif";
            diffCtx.textAlign = 'center'; diffCtx.textBaseline = 'middle';
            const cx = diffCanvas.width / 2; const cy1 = diffCanvas.height / 2 - 110; const cy2 = diffCanvas.height / 2 + 130; 

            const drawGraffitiLine = (txt, y) => {
                diffCtx.fillStyle = '#000000'; diffCtx.fillText(txt, cx + 25, y + 25);
                diffCtx.fillStyle = '#00ffff'; diffCtx.fillText(txt, cx + 12, y + 12);
                diffCtx.fillStyle = '#ff00ff'; diffCtx.fillText(txt, cx - 12, y - 12);
                const grad = diffCtx.createLinearGradient(0, y-100, 0, y+100);
                grad.addColorStop(0, '#ffff00'); grad.addColorStop(0.5, '#ff3300'); grad.addColorStop(1, '#ff00ff');
                diffCtx.fillStyle = grad; diffCtx.fillText(txt, cx, y);
                diffCtx.strokeStyle = '#111111'; diffCtx.lineWidth = 16; diffCtx.strokeText(txt, cx, y);
                diffCtx.strokeStyle = '#ffffff'; diffCtx.lineWidth = 4; diffCtx.strokeText(txt, cx-4, y-4);
            }
            drawGraffitiLine(line1, cy1); drawGraffitiLine(line2, cy2);
        };

        const smashTextDiffTex = new THREE.CanvasTexture(smashDiffCanvas);
        const smashTextEmTex = new THREE.CanvasTexture(smashEmCanvas);
        
        const drawNeonGraffiti = (c) => {
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.strokeStyle = '#333333'; ctx.lineWidth = 10; ctx.strokeRect(0,0, c.width, c.height);

            const neonColor = '#00bbff'; const coreColor = '#ffffff'; 
            const cx = c.width / 2; const cyText = c.height / 2 - 80; 

            ctx.font = "140px 'Sedgwick Ave Display', Impact, sans-serif";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const text = "BREAK THIS";

            ctx.shadowColor = neonColor; ctx.shadowBlur = 40; ctx.fillStyle = coreColor; 
            ctx.fillText(text, cx, cyText); ctx.fillText(text, cx, cyText); 
            ctx.shadowBlur = 10; ctx.strokeStyle = neonColor; ctx.lineWidth = 6; ctx.strokeText(text, cx, cyText);

            ctx.beginPath();
            const arrowTop = cyText + 100; const arrowBottom = arrowTop + 110;
            ctx.moveTo(cx, arrowTop); ctx.lineTo(cx, arrowBottom);
            ctx.lineTo(cx - 35, arrowBottom - 35); ctx.moveTo(cx, arrowBottom); ctx.lineTo(cx + 35, arrowBottom - 35);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            ctx.shadowColor = neonColor; ctx.shadowBlur = 40; ctx.strokeStyle = neonColor; ctx.lineWidth = 18;
            ctx.stroke(); ctx.stroke(); 
            ctx.shadowBlur = 10; ctx.strokeStyle = coreColor; ctx.lineWidth = 6; ctx.stroke();

            return c;
        };

        const sbL = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(0.5, ROOM_HEIGHT/2, SMASH_ROOM_L/2))}); sbL.position.set(-SMASH_ROOM_W/2, ROOM_HEIGHT/2, SMASH_Z); world.addBody(sbL);
        const sbR = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(0.5, ROOM_HEIGHT/2, SMASH_ROOM_L/2))}); sbR.position.set(SMASH_ROOM_W/2, ROOM_HEIGHT/2, SMASH_Z); world.addBody(sbR);
        const sbB = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(SMASH_ROOM_W/2, ROOM_HEIGHT/2, 0.5))}); sbB.position.set(0, ROOM_HEIGHT/2, SMASH_Z - SMASH_ROOM_L/2); world.addBody(sbB);

        // --- SMASHABLE CONTENTS ---
        function registerPhysicsPieceGroup(obj3D, shape, mass, position, eulerRot = null) {
            obj3D.position.copy(position);
            if (eulerRot) obj3D.rotation.set(eulerRot.x, eulerRot.y, eulerRot.z);
            
            obj3D.traverse((child) => {
                // Shadows disabled on debris objects
            });
            scene.add(obj3D);
            
            const body = new CANNON.Body({ mass: mass, shape: shape, material: defaultMaterial });
            body.position.copy(position);
            if (eulerRot) {
                const q = new THREE.Quaternion().setFromEuler(eulerRot);
                body.quaternion.set(q.x, q.y, q.z, q.w);
            }
            if (mass > 0) { body.allowSleep = true; body.sleep(); }
            world.addBody(body);
            physicsObjects.push({ mesh: obj3D, body: body });
        }

        // Ceramic Statues
        function createCurvedStatue(x, z) {
            const ped = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 2.5), materials.wallCement);
            ped.castShadow = true; ped.receiveShadow = true; 
            registerPhysicsPieceGroup(ped, new CANNON.Box(new CANNON.Vec3(1.25, 0.5, 1.25)), 0, new THREE.Vector3(x, 0.5, z));

            let currY = 1.0;
            registerPhysicsPieceGroup(
                new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32).scale(1, 0.5, 1), materials.ceramic),
                new CANNON.Box(new CANNON.Vec3(1.0, 0.5, 1.0)), 3, new THREE.Vector3(x, currY + 0.5, z)
            );
            currY += 1.0;
            registerPhysicsPieceGroup(
                new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 2.0, 32), materials.ceramic),
                new CANNON.Box(new CANNON.Vec3(0.5, 1.0, 0.5)), 2, new THREE.Vector3(x + 0.2, currY + 1.0, z - 0.2), new THREE.Euler(0.2, 0, -0.15) 
            );
            currY += 1.8;
            registerPhysicsPieceGroup(
                new THREE.Mesh(new THREE.TorusKnotGeometry(0.6, 0.25, 64, 16), materials.ceramic),
                new CANNON.Sphere(0.85), 1, new THREE.Vector3(x, currY + 0.8, z), new THREE.Euler(Math.PI/4, Math.PI/6, 0)
            );
        }

        function createFacetedStatue(x, z) {
            const ped = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), materials.wallCement);
            ped.castShadow = true; ped.receiveShadow = true;
            registerPhysicsPieceGroup(ped, new CANNON.Box(new CANNON.Vec3(1, 0.5, 1)), 0, new THREE.Vector3(x, 0.5, z));

            let currY = 1.0;
            for(let i=0; i<3; i++) {
                const size = 0.9 - (i * 0.15); const height = 1.2;
                registerPhysicsPieceGroup(
                    new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0).scale(1, height/size, 1), materials.ceramic),
                    new CANNON.Box(new CANNON.Vec3(size * 0.8, height, size * 0.8)),
                    1.5, new THREE.Vector3(x, currY + height, z), new THREE.Euler(0, i * Math.PI/3, 0) 
                );
                currY += height * 1.8;
            }
        }
        
        function createBalancedStatue(x, z) {
            const ped = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 2.5), materials.wallCement);
            ped.castShadow = true; ped.receiveShadow = true;
            registerPhysicsPieceGroup(ped, new CANNON.Box(new CANNON.Vec3(1.25, 0.5, 1.25)), 0, new THREE.Vector3(x, 0.5, z));

            let currY = 1.0;
            registerPhysicsPieceGroup(
                new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32).scale(1, 0.75, 1), materials.ceramic),
                new CANNON.Sphere(1.0), 3, new THREE.Vector3(x, currY + 0.9, z)
            );
            currY += 1.6;
            registerPhysicsPieceGroup(
                new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.4, 1.5, 32), materials.ceramic),
                new CANNON.Box(new CANNON.Vec3(0.6, 0.75, 0.6)), 2, new THREE.Vector3(x, currY + 0.75, z), new THREE.Euler(0.1, 0, 0.1) 
            );
            currY += 1.5;
            registerPhysicsPieceGroup(
                new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.3, 32, 64), materials.ceramic),
                new CANNON.Sphere(1.2), 1.5, new THREE.Vector3(x - 0.2, currY + 1.0, z), new THREE.Euler(Math.PI/6, Math.PI/3, 0)
            );
        }

        createCurvedStatue(-6, SMASH_Z - 6);
        createFacetedStatue(6, SMASH_Z + 6);
        createBalancedStatue(-16, SMASH_Z); 

        // --- UPDATED: TALLER BROKEN WOODEN PALLET STACKS WITH FIXED VASES ---
        function createBrokenPalletStack(x, z, rotY, addVases = false) {
            const cx = Math.cos(rotY);
            const cz = Math.sin(rotY);
            const offset = (lx, ly, lz) => {
                const nx = x + lx * cx - lz * cz;
                const nz = z + lx * cz + lz * cx;
                return new THREE.Vector3(nx, ly, nz);
            };

            const createPalletMesh = () => {
                const pallet = new THREE.Group();
                const mat = materials.crateWood;
                for(let i=-0.8; i<=0.8; i+=0.8) {
                    const stringer = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 2.0), mat);
                    stringer.position.set(i, 0.0, 0);
                    pallet.add(stringer);
                }
                for(let i=-0.9; i<=0.9; i+=0.3) { 
                    const slat = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.05, 0.15), mat);
                    slat.position.set(0, 0.1, i);
                    pallet.add(slat);
                }
                for(let i=-0.9; i<=0.9; i+=0.9) {
                    const slat = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.05, 0.15), mat);
                    slat.position.set(0, -0.1, i);
                    pallet.add(slat);
                }
                return pallet;
            };

            const numPallets = Math.floor(Math.random() * 3) + 4; 
            let py = 0.13;
            let proty = rotY;
            let px = 0;
            let pz = 0;

            for(let i=0; i<numPallets; i++) {
                registerPhysicsPieceGroup(
                    createPalletMesh(), 
                    new CANNON.Box(new CANNON.Vec3(1.0, 0.125, 1.0)), 
                    15, 
                    offset(px, py, pz), 
                    new THREE.Euler(0, proty, 0)
                );
                py += 0.26; 
                proty += (Math.random() - 0.5) * 0.2;
                px += (Math.random() - 0.5) * 0.15;
                pz += (Math.random() - 0.5) * 0.15;
            }

            const createPlank = (lx, ly, lz, rx, ry, rz, width, length) => {
                const plank = new THREE.Mesh(new THREE.BoxGeometry(width, 0.04, length), materials.crateWood);
                registerPhysicsPieceGroup(plank, new CANNON.Box(new CANNON.Vec3(width/2, 0.02, length/2)), 3, offset(lx, ly, lz), new THREE.Euler(rx, rotY + ry, rz));
            };

            for(let i=0; i<8; i++) {
                createPlank(
                    (Math.random() - 0.5) * 2.5,          
                    Math.random() * (py * 0.8),           
                    (Math.random() - 0.5) * 2.5,          
                    (Math.random() - 0.5),                
                    Math.random() * Math.PI,              
                    (Math.random() - 0.5),                
                    0.1 + Math.random() * 0.1,            
                    1.0 + Math.random() * 1.0             
                );
            }

            // --- FIXED: PROCEDURAL VARIED CERAMIC VASES ON TOP ---
            if (addVases) {
                const numVases = Math.floor(Math.random() * 3) + 3; 
                const topSurfaceY = py - 0.1; 

                for (let v = 0; v < numVases; v++) {
                    const vx = x + px + (Math.random() - 0.5) * 1.2;
                    const vz = z + pz + (Math.random() - 0.5) * 1.2;
                    
                    const vaseGroup = new THREE.Group();

                    // Randomized Parameters
                    const baseRadius = 0.15 + Math.random() * 0.1; 
                    const baseScaleY = 0.8 + Math.random() * 1.0;  
                    const baseHeight = baseRadius * 2 * baseScaleY;

                    const neckHeight = 0.1 + Math.random() * 0.3; 
                    const neckBottomRad = baseRadius * (0.4 + Math.random() * 0.3); 
                    const neckTopRad = neckBottomRad * (0.7 + Math.random() * 0.6); 

                    const lipRad = neckTopRad + 0.02 + Math.random() * 0.03;
                    const lipTube = 0.015 + Math.random() * 0.02;

                    // Calculate positions
                    const neckPosY = (baseRadius * baseScaleY * 2) - (baseRadius*0.1) + (neckHeight / 2); 
                    const totalHeight = neckPosY + (neckHeight/2) + lipTube;
                    const maxWidth = Math.max(baseRadius * 2, lipRad * 2 + lipTube * 2);
                    
                    // Offset to shift meshes down so the group's origin matches its physical center
                    const yOffset = totalHeight / 2;

                    // Build Geometry
                    const base = new THREE.Mesh(new THREE.SphereGeometry(baseRadius, 16, 16), materials.ceramic);
                    base.scale.set(1, baseScaleY, 1);
                    base.position.y = (baseRadius * baseScaleY) - yOffset; 
                    vaseGroup.add(base);
                    
                    const neck = new THREE.Mesh(new THREE.CylinderGeometry(neckTopRad, neckBottomRad, neckHeight, 16), materials.ceramic);
                    neck.position.y = neckPosY - yOffset;
                    vaseGroup.add(neck);

                    const lip = new THREE.Mesh(new THREE.TorusGeometry(lipRad, lipTube, 8, 16), materials.ceramic);
                    lip.position.y = neckPosY + (neckHeight / 2) - yOffset;
                    lip.rotation.x = Math.PI / 2;
                    vaseGroup.add(lip);

                    registerPhysicsPieceGroup(
                        vaseGroup, 
                        new CANNON.Box(new CANNON.Vec3(maxWidth/2, totalHeight/2, maxWidth/2)), 
                        1.5 + Math.random(), 
                        new THREE.Vector3(vx, topSurfaceY + totalHeight/2, vz), 
                        new THREE.Euler(0, Math.random() * Math.PI, 0)
                    );
                }
            }

            const spotColor = vividColors[Math.floor(Math.random() * vividColors.length)];
            const spotLight = new THREE.SpotLight(spotColor, 5.0, 15, Math.PI / 6, 0.5, 1);
            spotLight.position.set(x, ROOM_HEIGHT - 0.5, z);
            
            const targetObj = new THREE.Object3D();
            targetObj.position.set(x, 0.1, z);
            smashGroup.add(targetObj);
            spotLight.target = targetObj;
            
            smashGroup.add(spotLight);
        }

        // --- SPAWN PALLET STACKS (Two of them with Vases) ---
        createBrokenPalletStack(-10, SMASH_Z - 4, Math.PI / 4, true);  
        createBrokenPalletStack(8, SMASH_Z + 6, -Math.PI / 6, false);
        createBrokenPalletStack(12, SMASH_Z - 8, Math.PI / 2, true);   
        createBrokenPalletStack(-6, SMASH_Z + 10, -Math.PI / 3, false);

        // --- REALISTIC E-WASTE BUILDERS ---
        function createRealisticCRT(x, y, z, rotY, screenTex) {
            const group = new THREE.Group();
            const casingMat = Math.random() > 0.5 ? materials.retroPlastic : materials.blackPlastic;
            
            const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 0.2), casingMat);
            bezel.position.set(0, 0, 0.4); group.add(bezel);
            
            const screenMat = screenTex ? screenTex : materials.screenOff;
            const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.65), screenMat);
            screen.position.set(0, 0, 0.51); group.add(screen);
            
            const back = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 0.8, 4), casingMat);
            back.rotation.y = Math.PI / 4; back.rotation.x = Math.PI / 2; back.position.set(0, 0, -0.1); group.add(back);

            registerPhysicsPieceGroup(group, new CANNON.Box(new CANNON.Vec3(0.5, 0.4, 0.5)), 10, new THREE.Vector3(x, y, z), new THREE.Euler(0, rotY, 0));
        }

        function createRealisticPC(x, y, z, rotY, isTower) {
            const group = new THREE.Group();
            const casingMat = Math.random() > 0.5 ? materials.retroPlastic : materials.blackPlastic;
            const w = isTower ? 0.4 : 1.2; const h = isTower ? 1.0 : 0.3; const d = isTower ? 1.0 : 1.0;
            
            const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), casingMat); group.add(box);
            const drive = new THREE.Mesh(new THREE.BoxGeometry(isTower? 0.25 : 0.4, 0.05, 0.02), materials.blackPlastic);
            drive.position.set(0, isTower? h/2 - 0.2 : 0, d/2 + 0.01); group.add(drive);

            registerPhysicsPieceGroup(group, new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)), 5, new THREE.Vector3(x, y, z), new THREE.Euler(0, rotY, 0));
        }


        // --- CORNER CLUMPED E-WASTE SCATTER ---
        const corners = [
            { cx: -15, cz: SMASH_Z - 15 }, 
            { cx:  15, cz: SMASH_Z - 15 }, 
            { cx: -15, cz: SMASH_Z + 15 }, 
            { cx:  15, cz: SMASH_Z + 15 }  
        ];

        corners.forEach(corner => {
            for (let x = -4; x <= 4; x += 2.5) {
                for (let z = -4; z <= 4; z += 2.5) {
                    if (Math.random() > 0.6) continue;
                    const px = corner.cx + x + (Math.random() - 0.5);
                    const pz = corner.cz + z + (Math.random() - 0.5);
                    
                    const stackCount = Math.floor(Math.random() * 2) + 1; 
                    let currentY = 0;

                    for (let k = 0; k < stackCount; k++) {
                        const isCRT = Math.random() > 0.5;
                        const rotY = Math.random() * Math.PI * 2;
                        
                        if (isCRT) {
                            currentY += 0.4; 
                            let tex = null;
                            const r = Math.random();
                            if (r > 0.7) tex = materials.screenStatic;
                            else if (r > 0.5) tex = materials.screenBars;
                            else if (r > 0.3) tex = materials.screenDOS;

                            createRealisticCRT(px + (Math.random()*0.2 - 0.1), currentY, pz + (Math.random()*0.2 - 0.1), rotY, tex);
                            currentY += 0.4;
                        } else {
                            const isTower = Math.random() > 0.5;
                            const h = isTower ? 1.0 : 0.3;
                            currentY += h / 2;
                            createRealisticPC(px + (Math.random()*0.2 - 0.1), currentY, pz + (Math.random()*0.2 - 0.1), rotY, isTower);
                            currentY += h / 2;
                        }
                    }
                }
            }
        });


        // --- HANGING GLASS BOTTLES ---
        function createHangingBottle(x, z, dropLen) {
            const attachY = ROOM_HEIGHT; 
            const bottleY = attachY - dropLen;

            const stringGeo = new THREE.CylinderGeometry(0.005, 0.005, dropLen);
            const stringMat = new THREE.MeshStandardMaterial({color: 0x222222});
            const stringMesh = new THREE.Mesh(stringGeo, stringMat);
            stringMesh.position.set(x, attachY - dropLen/2, z);
            scene.add(stringMesh);

            const bGroup = new THREE.Group();
            const mats = [materials.bottleGreen, materials.bottleBrown, materials.bottleClear];
            const bMat = mats[Math.floor(Math.random() * mats.length)];

            const bBase = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.8, 16), bMat);
            bGroup.add(bBase);
            const bNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.24, 0.4, 16), bMat);
            bNeck.position.y = 0.6; bGroup.add(bNeck);
            const bTop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 16), bMat);
            bTop.position.y = 0.95; bGroup.add(bTop);

            registerPhysicsPieceGroup(bGroup, new CANNON.Box(new CANNON.Vec3(0.24, 0.7, 0.24)), 1.0, new THREE.Vector3(x, bottleY, z));
        }

        for(let i=0; i < 15; i++) {
            const hx = (Math.random() - 0.5) * (SMASH_ROOM_W - 4);
            const hz = SMASH_Z + (Math.random() - 0.5) * (SMASH_ROOM_L - 4);
            const drop = 2 + Math.random() * 6; 
            createHangingBottle(hx, hz, drop);
        }

        // --- Loop ---
        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3(); 
        const direction = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // Smooth Room Transition
            const inMainRoom = camera.position.z > -30;
            const targetBgColor = inMainRoom ? colorDay : colorDark;
            const targetHemiIntensity = inMainRoom ? 0.6 : 0.15;
            const targetFogNear = inMainRoom ? 20 : 2; 
            const targetFogFar = inMainRoom ? 100 : 55;
            
            scene.background.lerp(targetBgColor, 0.05);
            scene.fog.color.lerp(targetBgColor, 0.05);
            scene.fog.near += (targetFogNear - scene.fog.near) * 0.05;
            scene.fog.far += (targetFogFar - scene.fog.far) * 0.05;
            hemiLight.intensity += (targetHemiIntensity - hemiLight.intensity) * 0.05;

            materials.neonSign.emissiveIntensity = Math.abs(Math.sin(time * 3)) * 0.8 + 0.4;

            if (controls.isLocked === true) {
                world.step(1/60, delta, 3);
                for (const obj of physicsObjects) { obj.mesh.position.copy(obj.body.position); obj.mesh.quaternion.copy(obj.body.quaternion); }

                velocity.x -= velocity.x * 10.0 * delta; 
                velocity.z -= velocity.z * 10.0 * delta;
                
                direction.z = Number(moveState.forward) - Number(moveState.backward); 
                direction.x = Number(moveState.right) - Number(moveState.left); 
                direction.normalize(); 
                
                if (moveState.forward || moveState.backward) velocity.z -= direction.z * 100.0 * delta; 
                if (moveState.left || moveState.right) velocity.x -= direction.x * 100.0 * delta;
                
                controls.moveRight(-velocity.x * delta); 
                controls.moveForward(-velocity.z * delta);
                
                let cx = camera.position.x; 
                let cz = camera.position.z;

                if (cz > -MAIN_ROOM_L/2) { 
                    cx = THREE.MathUtils.clamp(cx, -MAIN_ROOM_W/2+1, MAIN_ROOM_W/2-1);
                    if (Math.abs(cx) < doorWidth/2 - 1 && cz < -MAIN_ROOM_L/2 + 2) {
                        cz = Math.min(cz, MAIN_ROOM_L/2-1); 
                    } else {
                        cz = THREE.MathUtils.clamp(cz, -MAIN_ROOM_L/2+1, MAIN_ROOM_L/2-1);
                    }
                } else { 
                    cx = THREE.MathUtils.clamp(cx, -SMASH_ROOM_W/2+1, SMASH_ROOM_W/2-1);
                    if (Math.abs(cx) < doorWidth/2 - 1 && cz > SMASH_Z + SMASH_ROOM_L/2 - 2) {
                        cz = Math.max(cz, SMASH_Z - SMASH_ROOM_L/2+1); 
                    } else {
                        cz = THREE.MathUtils.clamp(cz, SMASH_Z - SMASH_ROOM_L/2+1, SMASH_Z + SMASH_ROOM_L/2-1);
                    }
                }
                
                camera.position.x = cx;
                camera.position.z = cz;
                camera.position.y = 1.7; 
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
