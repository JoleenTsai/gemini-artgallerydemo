<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Art Gallery - The Smash Room</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        canvas { display: block; }
        #ui-layer {
            position: absolute; bottom: 30px; width: 100%; text-align: center; pointer-events: none; user-select: none;
        }
        .hud-text {
            background: rgba(0, 0, 0, 0.5); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 14px;
            display: inline-block; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
        }
        .key { display: inline-block; padding: 2px 6px; background: rgba(255,255,255,0.2); border-radius: 4px; font-weight: bold; font-size: 11px; margin: 0 2px;}
        #pause-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: white;
            font-weight: 300; text-transform: uppercase; letter-spacing: 10px; background: rgba(0,0,0,0.3);
            padding: 20px 40px; border-radius: 8px; backdrop-filter: blur(10px); display: none; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; 
            width: 14px; height: 14px; 
            background-color: white; 
            border: 2px solid rgba(0,0,0,0.8); 
            border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 50; pointer-events: none;
            display: none; 
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="hud-text">
            <span id="status-text">Click to Walk</span> &nbsp;|&nbsp; 
            Move: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> &nbsp;|&nbsp; 
            Look: <b>Mouse</b> &nbsp;|&nbsp; 
            Pause: <span class="key">SPACE</span> &nbsp;|&nbsp;
            <b>Left Click: SMASH</b>
        </div>
    </div>
    <div id="pause-indicator">PAUSED</div>
    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // --- Config ---
        const MAIN_ROOM_W = 30;
        const MAIN_ROOM_L = 60;
        const ROOM_HEIGHT = 12;
        const SMASH_ROOM_W = 40;
        const SMASH_ROOM_L = 40;
        const SMASH_Z = -(MAIN_ROOM_L/2 + SMASH_ROOM_L/2); 
        const doorWidth = 8;
        
        // --- Physics Setup ---
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
        const physicsObjects = []; 
        const defaultMaterial = new CANNON.Material('default');
        const defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, { friction: 0.4, restitution: 0.2 });
        world.addContactMaterial(defaultContactMaterial);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: defaultMaterial });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 100); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 25); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; 
        document.body.appendChild(renderer.domElement);

        // --- Controls & Raycaster ---
        const controls = new PointerLockControls(camera, document.body);
        const statusText = document.getElementById('status-text');
        const pauseIndicator = document.getElementById('pause-indicator');
        const crosshair = document.getElementById('crosshair');
        const raycaster = new THREE.Raycaster();

        document.addEventListener('click', (e) => { 
            if(!controls.isLocked) { controls.lock(); return; }
            
            // SMASH MECHANIC
            if(e.button === 0) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(scene.children, true);
                for (let i = 0; i < intersects.length; i++) {
                    const hitMesh = intersects[i].object;
                    const physObj = physicsObjects.find(obj => obj.mesh === hitMesh);
                    if (physObj && physObj.body.mass > 0) {
                        const forceDirection = raycaster.ray.direction.clone().normalize();
                        const impulse = new CANNON.Vec3(forceDirection.x * 25, forceDirection.y * 25, forceDirection.z * 25);
                        const impactPoint = new CANNON.Vec3(intersects[i].point.x, intersects[i].point.y, intersects[i].point.z);
                        physObj.body.applyImpulse(impulse, impactPoint);
                        break; 
                    }
                }
            }
        });
        
        controls.addEventListener('lock', () => { 
            statusText.innerHTML = "Walking Mode"; 
            pauseIndicator.style.display = 'none'; 
            crosshair.style.display = 'block'; 
        });
        
        controls.addEventListener('unlock', () => { 
            statusText.innerHTML = "Paused - Click or Space to Resume"; 
            pauseIndicator.style.display = 'block'; 
            crosshair.style.display = 'none'; 
        });

        const moveState = { forward: false, backward: false, left: false, right: false };
        document.addEventListener('keydown', (e) => { 
            if (e.code === 'ArrowUp' || e.code === 'KeyW') moveState.forward = true; 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveState.left = true; 
            if (e.code === 'ArrowDown' || e.code === 'KeyS') moveState.backward = true; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveState.right = true; 
            if (e.code === 'Space') {
                if (controls.isLocked) controls.unlock();
                else controls.lock();
            }
        });

        document.addEventListener('keyup', (e) => { 
            if (e.code === 'ArrowUp' || e.code === 'KeyW') moveState.forward = false; 
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveState.left = false; 
            if (e.code === 'ArrowDown' || e.code === 'KeyS') moveState.backward = false; 
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveState.right = false; 
        });

        document.addEventListener('wheel', (e) => { 
            if (controls.isLocked) {
                camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.05, 20, 75); 
                camera.updateProjectionMatrix(); 
            }
        });

        // --- Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.8); scene.add(hemiLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 3.5); sunLight.position.set(-25, 60, -15); 
        sunLight.castShadow = true; sunLight.shadow.mapSize.set(4096, 4096); sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 200; sunLight.shadow.camera.left = -50; sunLight.shadow.camera.right = 50; sunLight.shadow.camera.top = 50; sunLight.shadow.camera.bottom = -50; sunLight.shadow.bias = -0.0002; scene.add(sunLight);

        // --- Texture Generators ---
        const vividColors = ['#ff00ff','#00ffff','#ffff00','#00ff00','#ff3300'];

        const createWoodenBoardTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#e3c099'; ctx.fillRect(0,0,512,512);
            for(let i=0;i<8;i++){const y=i*64;ctx.fillStyle=i%2?'rgba(0,0,0,0.03)':'rgba(255,255,255,0.03)';ctx.fillRect(0,y,512,64);ctx.fillStyle='rgba(139,90,43,0.2)';for(let j=0;j<400;j++)ctx.fillRect(Math.random()*512,y+Math.random()*64,Math.random()*80+20,Math.random()*2+1);ctx.fillStyle='#8a6642';ctx.fillRect(0,y,512,2);}
            return new THREE.CanvasTexture(c);
        };
        const createFleckedMarbleTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,512,512); ctx.lineWidth=2; ctx.strokeStyle='rgba(200,200,200,0.3)';
            for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.bezierCurveTo(Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512,Math.random()*512);ctx.stroke();}
            for(let i=0;i<6000;i++){const g=Math.floor(Math.random()*100)+80;ctx.fillStyle=`rgba(${g},${g},${g},${Math.random()*0.6+0.2})`;ctx.fillRect(Math.random()*512,Math.random()*512,Math.random()*2.5+0.5,Math.random()*2.5+0.5);}
            return new THREE.CanvasTexture(c);
        };
        const createSplatterTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,512,512); 
            for(let i=0;i<200;i++){ctx.fillStyle=vividColors[Math.floor(Math.random()*vividColors.length)];ctx.beginPath();const x=Math.random()*512;const y=Math.random()*512;const rad=Math.random()*30+5;ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();if(Math.random()>0.7){ctx.fillRect(x-rad/4,y,rad/2,Math.random()*100+20);}}
            return new THREE.CanvasTexture(c);
        };
        const createGraffitiTexture = () => {
            const c = document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,512,512); 
            ctx.lineCap='round'; ctx.lineJoin='round';
            for(let i=0;i<20;i++){ctx.strokeStyle=vividColors[Math.floor(Math.random()*vividColors.length)];ctx.lineWidth=Math.random()*10+5;ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);for(let j=0;j<5;j++)ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke();}
            return new THREE.CanvasTexture(c);
        };

        // NEW: Updated Text and Font Size
        const drawSmashText = (c) => {
            const ctx = c.getContext('2d');
            ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); 
            ctx.lineCap='round'; ctx.lineJoin='round';
            
            // Background squiggles
            for(let i=0; i<60; i++){
                ctx.strokeStyle = vividColors[Math.floor(Math.random()*vividColors.length)]; ctx.lineWidth = Math.random()*20+10;
                ctx.beginPath(); ctx.moveTo(Math.random()*c.width, Math.random()*c.height);
                for(let j=0;j<5;j++) ctx.lineTo(Math.random()*c.width, Math.random()*c.height); ctx.stroke();
            }
            
            const text = "smash the ceiling"; 
            // Applying the new fonts to mimic the "Next Ups" vibe - REDUCED SIZE to fit longer text
            ctx.font = "180px 'Sedgwick Ave Display', 'Rubik Dirt', Impact, sans-serif";
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const cx = c.width / 2; const cy = c.height / 2; 
            
            ctx.fillStyle = '#00ffff'; ctx.fillText(text, cx + 15, cy + 15);
            ctx.fillStyle = '#ffff00'; ctx.fillText(text, cx - 10, cy - 10);
            ctx.fillStyle = '#ff00ff'; ctx.fillText(text, cx, cy);
            ctx.strokeStyle = '#111111'; ctx.lineWidth = 10; ctx.strokeText(text, cx, cy);
            return c;
        };

        // Initialize Smash Texture
        const smashCanvas = document.createElement('canvas');
        smashCanvas.width = 2048; smashCanvas.height = 512;
        const smashTextTex = new THREE.CanvasTexture(drawSmashText(smashCanvas));
        
        // Wait for Google Fonts to load, then re-draw the texture dynamically
        document.fonts.ready.then(() => {
            drawSmashText(smashCanvas);
            smashTextTex.needsUpdate = true;
        });

        const woodTex = createWoodenBoardTexture(); woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping; woodTex.repeat.set(8,16);
        const marbleTex = createFleckedMarbleTexture(); marbleTex.wrapS=marbleTex.wrapT=THREE.RepeatWrapping; marbleTex.repeat.set(2,2);
        const splatterTex = createSplatterTexture(); splatterTex.wrapS=splatterTex.wrapT=THREE.RepeatWrapping; splatterTex.repeat.set(4,4);
        const graffitiTex = createGraffitiTexture(); graffitiTex.wrapS=graffitiTex.wrapT=THREE.RepeatWrapping; graffitiTex.repeat.set(2,2);
        
        const materials = {
            floorMain: new THREE.MeshStandardMaterial({map:woodTex, roughness:0.5}),
            floorSmash: new THREE.MeshStandardMaterial({map:splatterTex, roughness:0.8, metalness:0.1}),
            wallWhite: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4}),
            wallGraffiti: new THREE.MeshStandardMaterial({map:graffitiTex, roughness:0.6}),
            wallSmashText: new THREE.MeshStandardMaterial({map:smashTextTex, roughness:0.6}),
            ceiling: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6}),
            frame: new THREE.MeshStandardMaterial({color:0x333333, roughness:0.4}),
            canvas: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9}),
            glass: new THREE.MeshPhysicalMaterial({color:0xffffff, roughness:0, transmission:1, transparent:true, side:THREE.DoubleSide}),
            marble: new THREE.MeshStandardMaterial({map:marbleTex, roughness:0.1, metalness:0.1}),
            lantern: new THREE.MeshStandardMaterial({color:0xaaaaaa, metalness:0.9, roughness:0.2}),
            bulb: new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff}),
            beam: new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5}),
            rope: new THREE.MeshStandardMaterial({color:0x800000, roughness:0.9}),
            gold: new THREE.MeshStandardMaterial({color:0xffd700, metalness:1, roughness:0.2}),
            breakable: new THREE.MeshStandardMaterial({map:marbleTex, roughness:0.3}),
            junk: new THREE.MeshStandardMaterial({color:0x555555, roughness:0.8, metalness:0.5})
        };

        // --- MAIN ROOM ARCHITECTURE ---
        const floorMain = new THREE.Mesh(new THREE.PlaneGeometry(MAIN_ROOM_W, MAIN_ROOM_L), materials.floorMain);
        floorMain.rotation.x = -Math.PI / 2; floorMain.receiveShadow = true; scene.add(floorMain);

        const mainWallGroup = new THREE.Group();
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(MAIN_ROOM_W, ROOM_HEIGHT+1, 1), materials.wallWhite); frontWall.position.set(0, (ROOM_HEIGHT+1)/2, MAIN_ROOM_L/2); frontWall.receiveShadow = true; mainWallGroup.add(frontWall);
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, ROOM_HEIGHT+1, MAIN_ROOM_L), materials.wallWhite); leftWall.position.set(-MAIN_ROOM_W/2, (ROOM_HEIGHT+1)/2, 0); leftWall.receiveShadow = true; mainWallGroup.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, ROOM_HEIGHT+1, MAIN_ROOM_L), materials.wallWhite); rightWall.position.set(MAIN_ROOM_W/2, (ROOM_HEIGHT+1)/2, 0); rightWall.receiveShadow = true; mainWallGroup.add(rightWall);
        
        const whiteZ = -MAIN_ROOM_L/2 + 0.25; 
        const mainBackW = (MAIN_ROOM_W - doorWidth) / 2; 
        const bWallL = new THREE.Mesh(new THREE.BoxGeometry(mainBackW, ROOM_HEIGHT+1, 0.5), materials.wallWhite); bWallL.position.set(-(doorWidth/2 + mainBackW/2), (ROOM_HEIGHT+1)/2, whiteZ); bWallL.receiveShadow=true; mainWallGroup.add(bWallL);
        const bWallR = new THREE.Mesh(new THREE.BoxGeometry(mainBackW, ROOM_HEIGHT+1, 0.5), materials.wallWhite); bWallR.position.set((doorWidth/2 + mainBackW/2), (ROOM_HEIGHT+1)/2, whiteZ); bWallR.receiveShadow=true; mainWallGroup.add(bWallR);
        const doorLintelW = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, ROOM_HEIGHT+1-8, 0.5), materials.wallWhite); doorLintelW.position.set(0, 8 + (ROOM_HEIGHT+1-8)/2, whiteZ); doorLintelW.receiveShadow=true; mainWallGroup.add(doorLintelW);
        scene.add(mainWallGroup);

        // --- MAIN ROOM CEILING ---
        const ceilingGroup = new THREE.Group();
        const beamDepth = 0.8; const beamWidth = 0.6; const mainBeamSpacing = 6;
        const skylightWidth = 5; const centerCorridorWidth = 6;
        
        const transverseGeo = new THREE.BoxGeometry(MAIN_ROOM_W, beamDepth, beamWidth);
        for(let z = -MAIN_ROOM_L/2; z <= MAIN_ROOM_L/2; z += mainBeamSpacing) {
            const beam = new THREE.Mesh(transverseGeo, materials.beam); beam.position.set(0, ROOM_HEIGHT - beamDepth/2, z); beam.castShadow=true; beam.receiveShadow=true; ceilingGroup.add(beam);
        }
        const longBeamGeo = new THREE.BoxGeometry(beamWidth, beamDepth, MAIN_ROOM_L);
        const xInner = centerCorridorWidth/2 + beamWidth/2; const xOuter = xInner + skylightWidth;
        [xInner, -xInner, xOuter, -xOuter].forEach(x => {
            const beam = new THREE.Mesh(longBeamGeo, materials.beam); beam.position.set(x, ROOM_HEIGHT - beamDepth/2, 0); beam.castShadow=true; beam.receiveShadow=true; ceilingGroup.add(beam);
        });

        const centerRoof = new THREE.Mesh(new THREE.PlaneGeometry(centerCorridorWidth, MAIN_ROOM_L), materials.ceiling); centerRoof.rotation.x = Math.PI/2; centerRoof.position.set(0, ROOM_HEIGHT, 0); centerRoof.receiveShadow=true; ceilingGroup.add(centerRoof);
        const outerWidth = (MAIN_ROOM_W/2) - xOuter;
        const leftRoof = new THREE.Mesh(new THREE.PlaneGeometry(outerWidth, MAIN_ROOM_L), materials.ceiling); leftRoof.rotation.x = Math.PI/2; leftRoof.position.set(-(xOuter + outerWidth/2), ROOM_HEIGHT, 0); leftRoof.receiveShadow=true; ceilingGroup.add(leftRoof);
        const rightRoof = new THREE.Mesh(new THREE.PlaneGeometry(outerWidth, MAIN_ROOM_L), materials.ceiling); rightRoof.rotation.x = Math.PI/2; rightRoof.position.set((xOuter + outerWidth/2), ROOM_HEIGHT, 0); rightRoof.receiveShadow=true; ceilingGroup.add(rightRoof);
        
        const skylightGeo = new THREE.PlaneGeometry(skylightWidth, MAIN_ROOM_L);
        const leftGlass = new THREE.Mesh(skylightGeo, materials.glass); leftGlass.rotation.x = Math.PI/2; leftGlass.position.set(-(xInner + skylightWidth/2), ROOM_HEIGHT, 0); ceilingGroup.add(leftGlass);
        const rightGlass = new THREE.Mesh(skylightGeo, materials.glass); rightGlass.rotation.x = Math.PI/2; rightGlass.position.set((xInner + skylightWidth/2), ROOM_HEIGHT, 0); ceilingGroup.add(rightGlass);
        scene.add(ceilingGroup);

        // --- THIN METAL FIXTURES ---
        const lightsGroup = new THREE.Group();
        function createLantern(zPos) {
            const fixture = new THREE.Group();
            const attachY = ROOM_HEIGHT - beamDepth; const dropLen = 4.5; 
            const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, dropLen), materials.lantern); rod.position.y = attachY - (dropLen/2); fixture.add(rod);
            const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.1), materials.lantern); socket.position.y = attachY - dropLen - 0.05; fixture.add(socket);
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), materials.bulb); bulb.position.y = attachY - dropLen - 0.1 - 0.24; fixture.add(bulb);
            const pointLight = new THREE.PointLight(0xffffff, 0.8, 15); pointLight.position.set(0, attachY - dropLen - 0.5, 0); fixture.add(pointLight);
            fixture.position.z = zPos; return fixture;
        }
        for(let z = -MAIN_ROOM_L/2 + mainBeamSpacing; z < MAIN_ROOM_L/2; z += mainBeamSpacing*2) { lightsGroup.add(createLantern(z)); }
        scene.add(lightsGroup);

        // --- WALL CANVASES ---
        function createWallCanvas(x, y, z, yRotation) {
            const group = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.5, 0.1), materials.frame); frame.castShadow=true; group.add(frame);
            const canvas = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 0.02), materials.canvas); canvas.position.z=0.06; group.add(canvas);
            group.position.set(x, y, z); group.rotation.y = yRotation; scene.add(group);
        }
        for (let zPos = -25; zPos <= 25; zPos += 10) { createWallCanvas(-MAIN_ROOM_W/2+0.6, 3, zPos, Math.PI/2); createWallCanvas(MAIN_ROOM_W/2-0.6, 3, zPos, -Math.PI/2); }
        createWallCanvas(-8, 3, -MAIN_ROOM_L/2+0.6, 0); createWallCanvas(8, 3, -MAIN_ROOM_L/2+0.6, 0);

        // --- MAIN ROOM STATUE & FENCE ---
        const centralGroup = new THREE.Group(); scene.add(centralGroup);
        const base1 = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 8), materials.marble); base1.position.y = 0.2; base1.receiveShadow=true; centralGroup.add(base1);
        const base2 = new THREE.Mesh(new THREE.BoxGeometry(5, 0.4, 7), materials.marble); base2.position.y = 0.6; base2.receiveShadow=true; centralGroup.add(base2);
        const pedestal = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.0, 3.5), materials.marble); pedestal.position.y = 1.3; pedestal.castShadow=true; pedestal.receiveShadow=true; centralGroup.add(pedestal);
        const sculpture = new THREE.Group(); sculpture.position.y = 1.8; 
        const core = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 2.8, 16), materials.marble); core.position.set(0, 1.4, 0.2); core.rotation.set(-Math.PI/8, Math.PI/12, 0); core.castShadow=true; sculpture.add(core);
        const cowl = new THREE.Mesh(new THREE.SphereGeometry(0.65, 24, 24).scale(1, 1.3, 1.6), materials.marble); cowl.position.set(0.1, 2.9, 0.6); cowl.rotation.x = -Math.PI/5; cowl.castShadow=true; sculpture.add(cowl);
        const twist = new THREE.Mesh(new THREE.TorusKnotGeometry(0.7, 0.2, 100, 16, 2, 3).scale(1.1, 1.8, 1.1), materials.marble); twist.position.set(0, 1.5, 0.3); twist.rotation.set(Math.PI/2.2, 0, -Math.PI/6); twist.castShadow=true; sculpture.add(twist);
        const baseCloth = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 16, 0, Math.PI*2, 0, Math.PI/2).scale(1.4, 0.6, 1.4), materials.marble); baseCloth.position.y = 0.1; baseCloth.castShadow=true; sculpture.add(baseCloth);
        centralGroup.add(sculpture);

        const fenceGroup = new THREE.Group(); const postPositions = [[-3.5, -5.5], [3.5, -5.5], [3.5, 5.5], [-3.5, 5.5]]; const posts = [];
        postPositions.forEach(pos => { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1), materials.gold); post.position.set(pos[0], 0.5, pos[1]); post.castShadow=true; fenceGroup.add(post); posts.push(post.position.clone().add(new THREE.Vector3(0, 0.4, 0))); });
        function createRope(startVec, endVec) { const midVec = new THREE.Vector3().lerpVectors(startVec, endVec, 0.5); midVec.y -= 0.3; const curve = new THREE.CatmullRomCurve3([startVec, midVec, endVec]); const rope = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.04, 8, false), materials.rope); rope.castShadow=true; fenceGroup.add(rope); }
        createRope(posts[0], posts[1]); createRope(posts[1], posts[2]); createRope(posts[2], posts[3]); createRope(posts[3], posts[0]); scene.add(fenceGroup);

        // --- SMASH ROOM ARCHITECTURE ---
        const smashGroup = new THREE.Group();
        const smashFloorMesh = new THREE.Mesh(new THREE.PlaneGeometry(SMASH_ROOM_W, SMASH_ROOM_L), materials.floorSmash);
        smashFloorMesh.rotation.x = -Math.PI / 2; smashFloorMesh.position.set(0, 0.01, SMASH_Z); smashFloorMesh.receiveShadow = true; scene.add(smashFloorMesh);

        const grafZ = -MAIN_ROOM_L/2 - 0.25;  
        const smashFrontW = (SMASH_ROOM_W - doorWidth) / 2;
        const sWallF_L = new THREE.Mesh(new THREE.BoxGeometry(smashFrontW, ROOM_HEIGHT+1, 0.5), materials.wallGraffiti); sWallF_L.position.set(-(doorWidth/2 + smashFrontW/2), (ROOM_HEIGHT+1)/2, grafZ); sWallF_L.receiveShadow=true; smashGroup.add(sWallF_L);
        const sWallF_R = new THREE.Mesh(new THREE.BoxGeometry(smashFrontW, ROOM_HEIGHT+1, 0.5), materials.wallGraffiti); sWallF_R.position.set((doorWidth/2 + smashFrontW/2), (ROOM_HEIGHT+1)/2, grafZ); sWallF_R.receiveShadow=true; smashGroup.add(sWallF_R);
        const doorLintelG = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, ROOM_HEIGHT+1-8, 0.5), materials.wallGraffiti); doorLintelG.position.set(0, 8 + (ROOM_HEIGHT+1-8)/2, grafZ); doorLintelG.receiveShadow=true; smashGroup.add(doorLintelG);

        const sWallL = new THREE.Mesh(new THREE.BoxGeometry(1, ROOM_HEIGHT, SMASH_ROOM_L), materials.wallGraffiti); sWallL.position.set(-SMASH_ROOM_W/2, ROOM_HEIGHT/2, SMASH_Z); sWallL.receiveShadow=true; smashGroup.add(sWallL);
        const sWallR = new THREE.Mesh(new THREE.BoxGeometry(1, ROOM_HEIGHT, SMASH_ROOM_L), materials.wallGraffiti); sWallR.position.set(SMASH_ROOM_W/2, ROOM_HEIGHT/2, SMASH_Z); sWallR.receiveShadow=true; smashGroup.add(sWallR);
        
        // UPDATE BACK WALL WITH TEXT TEXTURE ON INWARD FACE (+z index 4)
        const sWallB_Mats = [ materials.wallGraffiti, materials.wallGraffiti, materials.wallGraffiti, materials.wallGraffiti, materials.wallSmashText, materials.wallGraffiti ];
        const sWallB = new THREE.Mesh(new THREE.BoxGeometry(SMASH_ROOM_W, ROOM_HEIGHT, 1), sWallB_Mats); sWallB.position.set(0, ROOM_HEIGHT/2, SMASH_Z - SMASH_ROOM_L/2); sWallB.receiveShadow=true; smashGroup.add(sWallB);
        
        const smashCeiling = new THREE.Mesh(new THREE.PlaneGeometry(SMASH_ROOM_W, SMASH_ROOM_L), materials.glass);
        smashCeiling.rotation.x = Math.PI / 2; smashCeiling.position.set(0, ROOM_HEIGHT, SMASH_Z); smashGroup.add(smashCeiling);
        scene.add(smashGroup);

        // Physics Boundaries
        const wallBoundMass = 0;
        const wbL = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(0.5, ROOM_HEIGHT/2, MAIN_ROOM_L/2))}); wbL.position.set(-MAIN_ROOM_W/2, ROOM_HEIGHT/2, 0); world.addBody(wbL);
        const wbR = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(0.5, ROOM_HEIGHT/2, MAIN_ROOM_L/2))}); wbR.position.set(MAIN_ROOM_W/2, ROOM_HEIGHT/2, 0); world.addBody(wbR);
        const sbL = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(0.5, ROOM_HEIGHT/2, SMASH_ROOM_L/2))}); sbL.position.set(-SMASH_ROOM_W/2, ROOM_HEIGHT/2, SMASH_Z); world.addBody(sbL);
        const sbR = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(0.5, ROOM_HEIGHT/2, SMASH_ROOM_L/2))}); sbR.position.set(SMASH_ROOM_W/2, ROOM_HEIGHT/2, SMASH_Z); world.addBody(sbR);
        const sbB = new CANNON.Body({mass: wallBoundMass, shape: new CANNON.Box(new CANNON.Vec3(SMASH_ROOM_W/2, ROOM_HEIGHT/2, 0.5))}); sbB.position.set(0, ROOM_HEIGHT/2, SMASH_Z - SMASH_ROOM_L/2); world.addBody(sbB);

        // --- SMASHABLE CONTENTS ---
        function createPhysicsBox(pos, size, mass, material) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material);
            mesh.position.copy(pos); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh);
            const shape = new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2));
            const body = new CANNON.Body({ mass: mass, shape: shape, material: defaultMaterial });
            body.position.copy(pos); world.addBody(body);
            physicsObjects.push({ mesh, body });
        }

        function createBreakableSculpture(x, z) {
            const pedMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), materials.wallGraffiti); pedMesh.position.set(x, 0.5, z); pedMesh.receiveShadow=true; scene.add(pedMesh);
            const pedBody = new CANNON.Body({mass:0, shape: new CANNON.Box(new CANNON.Vec3(1,0.5,1))}); pedBody.position.set(x,0.5,z); world.addBody(pedBody);
            const blockSize = 0.5;
            for(let i=0; i<3; i++) {
                for(let j=0; j<5; j++) {
                    for(let k=0; k<3; k++) {
                        const bx = x + (i-1)*blockSize*1.05; const by = 1 + blockSize/2 + j*blockSize*1.05; const bz = z + (k-1)*blockSize*1.05;
                        createPhysicsBox(new THREE.Vector3(bx,by,bz), new THREE.Vector3(blockSize,blockSize,blockSize), 0.5, materials.breakable);
                    }
                }
            }
        }
        createBreakableSculpture(-5, SMASH_Z - 5);
        createBreakableSculpture(5, SMASH_Z + 5);

        function createJunkPile(x, z) {
             for(let i=0; i<15; i++) {
                const size = new THREE.Vector3(Math.random()*0.8+0.4, Math.random()*0.8+0.4, Math.random()*0.8+0.4);
                createPhysicsBox(new THREE.Vector3(x + (Math.random()-0.5)*4, size.y/2 + Math.random()*2, z + (Math.random()-0.5)*4), size, 1, materials.junk);
             }
             createPhysicsBox(new THREE.Vector3(x, 1.5, z), new THREE.Vector3(2, 1.5, 0.5), 5, materials.junk);
        }
        createJunkPile(0, SMASH_Z + 10);
        createJunkPile(-8, SMASH_Z - 2);

        // --- Loop ---
        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3(); 
        const direction = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (controls.isLocked === true) {
                world.step(1/60, delta, 3);
                for (const obj of physicsObjects) { obj.mesh.position.copy(obj.body.position); obj.mesh.quaternion.copy(obj.body.quaternion); }

                velocity.x -= velocity.x * 10.0 * delta; 
                velocity.z -= velocity.z * 10.0 * delta;
                
                direction.z = Number(moveState.forward) - Number(moveState.backward); 
                direction.x = Number(moveState.right) - Number(moveState.left); 
                direction.normalize(); 
                
                if (moveState.forward || moveState.backward) velocity.z -= direction.z * 100.0 * delta; 
                if (moveState.left || moveState.right) velocity.x -= direction.x * 100.0 * delta;
                
                controls.moveRight(-velocity.x * delta); 
                controls.moveForward(-velocity.z * delta);
                
                let cx = camera.position.x; 
                let cz = camera.position.z;

                if (cz > -MAIN_ROOM_L/2) { 
                    cx = THREE.MathUtils.clamp(cx, -MAIN_ROOM_W/2+1, MAIN_ROOM_W/2-1);
                    if (Math.abs(cx) < doorWidth/2 - 1 && cz < -MAIN_ROOM_L/2 + 2) {
                        cz = Math.min(cz, MAIN_ROOM_L/2-1); 
                    } else {
                        cz = THREE.MathUtils.clamp(cz, -MAIN_ROOM_L/2+1, MAIN_ROOM_L/2-1);
                    }
                } else { 
                    cx = THREE.MathUtils.clamp(cx, -SMASH_ROOM_W/2+1, SMASH_ROOM_W/2-1);
                    if (Math.abs(cx) < doorWidth/2 - 1 && cz > SMASH_Z + SMASH_ROOM_L/2 - 2) {
                        cz = Math.max(cz, SMASH_Z - SMASH_ROOM_L/2+1); 
                    } else {
                        cz = THREE.MathUtils.clamp(cz, SMASH_Z - SMASH_ROOM_L/2+1, SMASH_Z + SMASH_ROOM_L/2-1);
                    }
                }
                
                camera.position.x = cx;
                camera.position.z = cz;
                camera.position.y = 1.7; 
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
